<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>roadmap</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,650;0,8..60,700;1,8..60,400&display=swap" rel="stylesheet">
<style>:root {--ink: #141414; --ink-2: #3d3c39; --muted: #6b6a65; --accent: #1c5cab;}

html, body { margin: 0; background: #ffffff; }
svg { display: block; }
text { font-family: "Source Serif 4", "Source Serif Pro", Georgia, serif; }
.rm-name { font-size: 14px; font-weight: 650; fill: var(--ink); }
.rm-q { font-size: 12.5px; fill: var(--ink-2); }
.rm-lane { font-size: 12px; font-weight: 600; letter-spacing: 0.04em; fill: var(--muted); }
.rm-side { fill: var(--muted); }
.rm-name.rm-side { fill: var(--ink-2); font-weight: 600; }
.rm-lane-main { fill: var(--accent); }
.rm-hl { fill: var(--ink); }
.rm-qtag { font-weight: 700; }
.rm-hl-bg { fill: #f1eff8; }
/* Figure 9 only */
.rm-find { font-size: 12.5px; fill: var(--ink-2); }
.rm-ev { font-size: 11.5px; font-style: italic; fill: var(--muted); }
</style></head>
<body><div style="width:734px;height:650px"><svg viewBox="0 0 734 650" width="734" height="650" role="img" aria-label="Roadmap of the experiments: the main line from the synthetic discs to the fully trained main experiment, with the still photographs, degree 3 and 7, and the three steps of Q3 as branches"><defs><marker id="rm-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8f8d86"/></marker><marker id="rm-arrow-main" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#141414"/></marker></defs><rect x="14" y="10" width="358" height="472" rx="10" fill="#e8f0fb" stroke="#bcd2ef"/><text x="28" y="31" class="rm-lane rm-lane-main">Main line</text><text x="400" y="31" class="rm-lane">Diagnostics and extensions</text><rect data-box="0" x="28" y="44" width="330" height="54" rx="6" fill="#ffffff" stroke="#141414" stroke-width="1.6"/><text data-in="0" x="40" y="65" class="rm-name">Synthetic discs</text><text data-in="0" x="40" y="83" class="rm-q">Does fitting work on motion with a known path?</text><rect data-box="1" x="28" y="118" width="330" height="54" rx="6" fill="#ffffff" stroke="#141414" stroke-width="1.6"/><text data-in="1" x="40" y="139" class="rm-name">Tuning</text><text data-in="1" x="40" y="157" class="rm-q">Best settings of each model</text><rect data-box="2" x="28" y="192" width="330" height="54" rx="6" fill="#ffffff" stroke="#141414" stroke-width="1.6"/><text data-in="2" x="40" y="213" class="rm-name">Main experiment, 3,000 steps</text><text data-in="2" x="40" y="231" class="rm-q rm-hl"><tspan class="rm-qtag">Q1</tspan> at the planned training length</text><rect data-box="3" x="28" y="266" width="330" height="54" rx="6" fill="#ffffff" stroke="#141414" stroke-width="1.6" stroke-dasharray="6 4"/><text data-in="3" x="40" y="287" class="rm-name">More Gaussians; longer training</text><text data-in="3" x="40" y="305" class="rm-q">Is 3,000 steps enough?</text><rect data-box="4" x="28" y="340" width="330" height="54" rx="6" fill="#ffffff" stroke="#141414" stroke-width="1.6" stroke-dasharray="6 4"/><text data-in="4" x="40" y="361" class="rm-name">Re-tuning for full training</text><text data-in="4" x="40" y="379" class="rm-q">Learning rates at 30,000 steps</text><rect data-box="5" x="28" y="414" width="330" height="54" rx="6" fill="#ffffff" stroke="#141414" stroke-width="1.6" stroke-dasharray="6 4"/><text data-in="5" x="40" y="435" class="rm-name">Main experiment, fully trained</text><text data-in="5" x="40" y="453" class="rm-q">Q1 and Q2 with full training</text><line x1="193.0" y1="98" x2="193.0" y2="116" stroke="#141414" stroke-width="2" marker-end="url(#rm-arrow-main)"/><line x1="193.0" y1="172" x2="193.0" y2="190" stroke="#141414" stroke-width="2" marker-end="url(#rm-arrow-main)"/><line x1="193.0" y1="246" x2="193.0" y2="264" stroke="#141414" stroke-width="2" marker-end="url(#rm-arrow-main)"/><line x1="193.0" y1="320" x2="193.0" y2="338" stroke="#141414" stroke-width="2" marker-end="url(#rm-arrow-main)"/><line x1="193.0" y1="394" x2="193.0" y2="412" stroke="#141414" stroke-width="2" marker-end="url(#rm-arrow-main)"/><rect data-box="6" x="400" y="192" width="318" height="54" rx="6" fill="#fbfaf8" stroke="#8f8d86" stroke-width="1.2" stroke-dasharray="5 4"/><text data-in="6" x="412" y="213" class="rm-name rm-side">Still photographs</text><text data-in="6" x="412" y="231" class="rm-q rm-side rm-hl"><tspan class="rm-qtag">Q2</tspan>: does the gain need motion?</text><line x1="358" y1="219.0" x2="398" y2="219.0" stroke="#8f8d86" stroke-width="1.3" marker-end="url(#rm-arrow)"/><rect data-box="7" x="400" y="414" width="318" height="54" rx="6" fill="#fbfaf8" stroke="#8f8d86" stroke-width="1.2"/><text data-in="7" x="412" y="435" class="rm-name rm-side">Degree 3 and 7</text><text data-in="7" x="412" y="453" class="rm-q rm-side">Does a more flexible path help?</text><line x1="358" y1="441.0" x2="398" y2="441.0" stroke="#8f8d86" stroke-width="1.3" marker-end="url(#rm-arrow)"/><rect x="14" y="494" width="704" height="118" rx="10" fill="#f3f2ee"/><text x="104" y="514" class="rm-lane rm-hl"><tspan class="rm-qtag">Q3</tspan>: the frames between</text><line x1="84" y1="468" x2="84" y2="526" stroke="#141414" stroke-width="2" marker-end="url(#rm-arrow-main)"/><rect data-box="8" x="28" y="528" width="212" height="70" rx="6" fill="#fbfaf8" stroke="#8f8d86" stroke-width="1.2" stroke-dasharray="5 4"/><text data-in="8" x="40" y="549" class="rm-name rm-side">Frames between</text><text data-in="8" x="40" y="567" class="rm-q rm-side">No new fits: drawn from</text><text data-in="8" x="40" y="582" class="rm-q rm-side">the fully trained models</text><rect data-box="9" x="260" y="528" width="212" height="70" rx="6" fill="#fbfaf8" stroke="#8f8d86" stroke-width="1.2" stroke-dasharray="5 4"/><text data-in="9" x="272" y="549" class="rm-name rm-side">Synthetic arcs (two versions)</text><text data-in="9" x="272" y="567" class="rm-q rm-side">Q3 on motion with a known,</text><text data-in="9" x="272" y="582" class="rm-q rm-side">adjustable bend</text><rect data-box="10" x="492" y="528" width="212" height="70" rx="6" fill="#fbfaf8" stroke="#8f8d86" stroke-width="1.2" stroke-dasharray="5 4"/><text data-in="10" x="504" y="549" class="rm-name rm-side">Confirmatory test</text><text data-in="10" x="504" y="567" class="rm-q rm-side">Q3 on new real clips,</text><text data-in="10" x="504" y="582" class="rm-q rm-side">with the rule fixed first</text><line x1="240" y1="563.0" x2="258" y2="563.0" stroke="#8f8d86" stroke-width="1.3" marker-end="url(#rm-arrow)"/><line x1="472" y1="563.0" x2="490" y2="563.0" stroke="#8f8d86" stroke-width="1.3" marker-end="url(#rm-arrow)"/><rect x="28" y="627" width="26" height="14" rx="3" fill="#fff" stroke="#141414" stroke-width="1.4"/><text x="62" y="638" class="rm-q">planned in the proposal</text><rect x="228" y="627" width="26" height="14" rx="3" fill="#fff" stroke="#141414" stroke-width="1.4" stroke-dasharray="5 4"/><text x="262" y="638" class="rm-q">added to answer a question raised by earlier results</text></svg></div>
<script>
document.fonts.ready.then(() => {
  for (const t of document.querySelectorAll("text.rm-hl")) {
    const b = t.getBBox();
    const r = document.createElementNS("http://www.w3.org/2000/svg", "rect");
    Object.entries({ x: b.x - 5, y: b.y - 2, width: b.width + 10, height: b.height + 4, rx: 3, class: "rm-hl-bg" })
      .forEach(([k, v]) => r.setAttribute(k, v));
    t.before(r);
  }
  const boxes = [...document.querySelectorAll("rect[data-box]")].map((r) => r.getBBox());
  const bad = [];
  for (const t of document.querySelectorAll("text[data-in]")) {
    const b = t.getBBox(), box = boxes[+t.dataset.in];
    if (b.x < box.x + 4 || b.x + b.width > box.x + box.width - 4 || b.y < box.y || b.y + b.height > box.y + box.height)
      bad.push(t.textContent);
  }
  const fam = getComputedStyle(document.querySelector("text")).fontFamily;
  const ok = document.fonts.check('14px "Source Serif 4"');
  document.body.setAttribute("data-check", JSON.stringify({ fontLoaded: ok, family: fam, overflow: bad }));
});
</script></body></html>
