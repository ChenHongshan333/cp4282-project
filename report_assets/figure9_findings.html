<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>roadmap</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,650;0,8..60,700;1,8..60,400&display=swap" rel="stylesheet">
<style>:root {--ink: #141414; --ink-2: #3d3c39; --muted: #6b6a65; --accent: #1c5cab;}

html, body { margin: 0; background: #ffffff; }
svg { display: block; }
text { font-family: "Source Serif 4", "Source Serif Pro", Georgia, serif; }
.rm-name { font-size: 14px; font-weight: 650; fill: var(--ink); }
.rm-q { font-size: 12.5px; fill: var(--ink-2); }
.rm-lane { font-size: 12px; font-weight: 600; letter-spacing: 0.04em; fill: var(--muted); }
.rm-side { fill: var(--muted); }
.rm-name.rm-side { fill: var(--ink-2); font-weight: 600; }
.rm-lane-main { fill: var(--accent); }
.rm-hl { fill: var(--ink); }
.rm-qtag { font-weight: 700; }
.rm-hl-bg { fill: #f1eff8; }
/* Figure 9 only */
.rm-find { font-size: 12.5px; fill: var(--ink-2); }
.rm-ev { font-size: 11.5px; font-style: italic; fill: var(--muted); }
</style></head>
<body><div style="width:940px;height:826px"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 826" width="940" height="826" role="img" aria-label="Roadmap of the experiments with the finding of each step"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8f8d86"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#141414"/></marker></defs><rect x="14" y="10" width="458" height="622" rx="10" fill="#e8f0fb" stroke="#bcd2ef"/><text x="28" y="31" class="rm-lane rm-lane-main">Main line</text><text x="498" y="31" class="rm-lane">Diagnostics and extensions</text><rect data-box="0" x="28" y="44" width="430" height="88" rx="6" fill="#ffffff" stroke="#141414" stroke-width="1.6"/><text data-in="0" x="40" y="65" class="rm-name">Synthetic discs</text><text data-in="0" x="446" y="65" class="rm-ev" text-anchor="end">Preliminary diagnostic</text><text data-in="0" x="40" y="86" class="rm-find">All three abilities beat M0, but M1's gain fell from +1.27</text><text data-in="0" x="40" y="102" class="rm-find">to −0.02 dB at a lower velocity learning rate, so that rate</text><text data-in="0" x="40" y="118" class="rm-find">was tuned for every model.</text><rect data-box="1" x="28" y="154" width="430" height="72" rx="6" fill="#ffffff" stroke="#141414" stroke-width="1.6"/><text data-in="1" x="40" y="175" class="rm-name">Tuning</text><text data-in="1" x="446" y="175" class="rm-ev" text-anchor="end">Validation clip</text><text data-in="1" x="40" y="196" class="rm-find">Every model, the baseline included, uses the best setting</text><text data-in="1" x="40" y="212" class="rm-find">found in the tested range; best and worst differ by 0.3 to 0.6 dB.</text><line x1="243.0" y1="132" x2="243.0" y2="152" stroke="#141414" stroke-width="2" marker-end="url(#am)"/><rect data-box="2" x="28" y="248" width="430" height="88" rx="6" fill="#ffffff" stroke="#141414" stroke-width="1.6"/><text data-in="2" x="40" y="269" class="rm-name">Main experiment, 3,000 steps<tspan class="rm-qtag" dx="8" style="fill:var(--accent)">Q1</tspan></text><text data-in="2" x="446" y="269" class="rm-ev" text-anchor="end">Reliable</text><text data-in="2" x="40" y="290" class="rm-find">M2 and M3 beat M0 by 0.5 to 2.3 dB and pass the test;</text><text data-in="2" x="40" y="306" class="rm-find">M1 fails, and its gain lies mostly in the background.</text><line x1="243.0" y1="226" x2="243.0" y2="246" stroke="#141414" stroke-width="2" marker-end="url(#am)"/><rect data-box="3" x="498" y="248" width="414" height="88" rx="6" fill="#fbfaf8" stroke="#8f8d86" stroke-width="1.2" stroke-dasharray="5 4"/><text data-in="3" x="510" y="269" class="rm-name rm-side">Still photographs<tspan class="rm-qtag" dx="8" style="fill:var(--accent)">Q2</tspan></text><text data-in="3" x="900" y="269" class="rm-ev" text-anchor="end">Reliable</text><text data-in="3" x="510" y="290" class="rm-find">Shrinking gains 0.6 to 1.9 dB on still photographs,</text><text data-in="3" x="510" y="306" class="rm-find">about as much as on video: the early gains appear</text><text data-in="3" x="510" y="322" class="rm-find">without motion.</text><line x1="458" y1="292.0" x2="496" y2="292.0" stroke="#8f8d86" stroke-width="1.3" marker-end="url(#a)"/><rect data-box="4" x="28" y="358" width="430" height="72" rx="6" fill="#ffffff" stroke="#141414" stroke-width="1.6" stroke-dasharray="6 4"/><text data-in="4" x="40" y="379" class="rm-name">More Gaussians; longer training</text><text data-in="4" x="446" y="379" class="rm-ev" text-anchor="end">Fairly reliable</text><text data-in="4" x="40" y="400" class="rm-find">No ability keeps half of its lead at 10,000 steps: the early</text><text data-in="4" x="40" y="416" class="rm-find">gains count as faster learning.</text><line x1="243.0" y1="336" x2="243.0" y2="356" stroke="#141414" stroke-width="2" marker-end="url(#am)"/><rect data-box="5" x="28" y="452" width="430" height="72" rx="6" fill="#ffffff" stroke="#141414" stroke-width="1.6" stroke-dasharray="6 4"/><text data-in="5" x="40" y="473" class="rm-name">Re-tuning for full training</text><text data-in="5" x="446" y="473" class="rm-ev" text-anchor="end">Validation clip</text><text data-in="5" x="40" y="494" class="rm-find">Every model settles after 18,000 to 24,000 steps; the</text><text data-in="5" x="40" y="510" class="rm-find">learning rate moves the result by only about 0.1 dB.</text><line x1="243.0" y1="430" x2="243.0" y2="450" stroke="#141414" stroke-width="2" marker-end="url(#am)"/><rect data-box="6" x="28" y="546" width="430" height="72" rx="6" fill="#ffffff" stroke="#141414" stroke-width="1.6" stroke-dasharray="6 4"/><text data-in="6" x="40" y="567" class="rm-name">Main experiment, fully trained<tspan class="rm-qtag" dx="8" style="fill:var(--accent)">Q1, Q2</tspan></text><text data-in="6" x="446" y="567" class="rm-ev" text-anchor="end">Reliable</text><text data-in="6" x="40" y="588" class="rm-find">The baseline catches up: most cells are within ±0.3 dB,</text><text data-in="6" x="40" y="604" class="rm-find">and all three abilities fail the test.</text><line x1="243.0" y1="524" x2="243.0" y2="544" stroke="#141414" stroke-width="2" marker-end="url(#am)"/><rect data-box="7" x="498" y="546" width="414" height="72" rx="6" fill="#fbfaf8" stroke="#8f8d86" stroke-width="1.2"/><text data-in="7" x="510" y="567" class="rm-name rm-side">Degree 3 and 7</text><text data-in="7" x="900" y="567" class="rm-ev" text-anchor="end">Fairly reliable</text><text data-in="7" x="510" y="588" class="rm-find">D3 is worse than M1 in 7 of 8 cells; D7 is worse</text><text data-in="7" x="510" y="604" class="rm-find">everywhere, by 1.1 to 2.3 dB on the fitted frames.</text><line x1="458" y1="582.0" x2="496" y2="582.0" stroke="#8f8d86" stroke-width="1.3" marker-end="url(#a)"/><rect x="14" y="644" width="912" height="136" rx="10" fill="#f3f2ee"/><text x="104" y="664" class="rm-lane rm-hl"><tspan class="rm-qtag">Q3</tspan>: the frames between</text><line x1="84" y1="618" x2="84" y2="676" stroke="#141414" stroke-width="2" marker-end="url(#am)"/><rect data-box="8" x="28" y="678" width="278" height="88" rx="6" fill="#fbfaf8" stroke="#8f8d86" stroke-width="1.2" stroke-dasharray="5 4"/><text data-in="8" x="40" y="699" class="rm-name rm-side">Frames between</text><text data-in="8" x="294" y="699" class="rm-ev" text-anchor="end">Exploratory</text><text data-in="8" x="40" y="720" class="rm-find">M1 and M3 draw the dog 0.2 to</text><text data-in="8" x="40" y="736" class="rm-find">0.5 dB better between frames,</text><text data-in="8" x="40" y="752" class="rm-find">level on the fitted frames.</text><rect data-box="9" x="328" y="678" width="278" height="88" rx="6" fill="#fbfaf8" stroke="#8f8d86" stroke-width="1.2" stroke-dasharray="5 4"/><text data-in="9" x="340" y="699" class="rm-name rm-side">Synthetic arcs</text><text data-in="9" x="594" y="699" class="rm-ev" text-anchor="end">Reliable</text><text data-in="9" x="340" y="720" class="rm-find">The gain between frames grows</text><text data-in="9" x="340" y="736" class="rm-find">with the bend, up to about 9 dB;</text><text data-in="9" x="340" y="752" class="rm-find">the Gaussians bend with the motion.</text><line x1="306" y1="722.0" x2="326" y2="722.0" stroke="#8f8d86" stroke-width="1.3" marker-end="url(#a)"/><rect data-box="10" x="628" y="678" width="278" height="88" rx="6" fill="#fbfaf8" stroke="#8f8d86" stroke-width="1.2" stroke-dasharray="5 4"/><text data-in="10" x="640" y="699" class="rm-name rm-side">Confirmatory test</text><text data-in="10" x="894" y="699" class="rm-ev" text-anchor="end">Fairly reliable</text><text data-in="10" x="640" y="720" class="rm-find">The moving object is about 0.5 dB</text><text data-in="10" x="640" y="736" class="rm-find">better between frames; 9 of 12 cells</text><text data-in="10" x="640" y="752" class="rm-find">pass. No consistent whole-frame gain.</text><line x1="606" y1="722.0" x2="626" y2="722.0" stroke="#8f8d86" stroke-width="1.3" marker-end="url(#a)"/><rect x="28" y="796" width="26" height="14" rx="3" fill="#fff" stroke="#141414" stroke-width="1.4"/><text x="62" y="807" class="rm-q">planned in the proposal</text><rect x="228" y="796" width="26" height="14" rx="3" fill="#fff" stroke="#141414" stroke-width="1.4" stroke-dasharray="5 4"/><text x="262" y="807" class="rm-q">added to answer a question raised by earlier results</text><text x="912" y="807" class="rm-ev" text-anchor="end">italic: kind and strength of the evidence</text></svg></div>
<script>
document.fonts.ready.then(() => {
  for (const t of document.querySelectorAll("text.rm-hl")) {
    const b = t.getBBox();
    const r = document.createElementNS("http://www.w3.org/2000/svg", "rect");
    Object.entries({ x: b.x - 5, y: b.y - 2, width: b.width + 10, height: b.height + 4, rx: 3, class: "rm-hl-bg" })
      .forEach(([k, v]) => r.setAttribute(k, v));
    t.before(r);
  }
  const boxes = [...document.querySelectorAll("rect[data-box]")].map((r) => r.getBBox());
  const bad = [];
  for (const t of document.querySelectorAll("text[data-in]")) {
    const b = t.getBBox(), box = boxes[+t.dataset.in];
    if (b.x < box.x + 4 || b.x + b.width > box.x + box.width - 4 || b.y < box.y || b.y + b.height > box.y + box.height)
      bad.push(t.textContent);
  }
  const fam = getComputedStyle(document.querySelector("text")).fontFamily;
  const ok = document.fonts.check('14px "Source Serif 4"');
  document.body.setAttribute("data-check", JSON.stringify({ fontLoaded: ok, family: fam, overflow: bad }));
});
</script></body></html>
